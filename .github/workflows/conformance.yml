name: Template Conformance

on:
  pull_request:
    branches: [main]

jobs:
  conformance:
    name: Verify template conforms to canon modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check biome.json matches linting module
        run: diff modules/linting/biome.json template/biome.json

      - name: Check pre-commit matches hooks module
        run: diff modules/hooks/pre-commit template/.husky/pre-commit

      - name: Check vitest config matches testing module
        run: diff modules/testing/vitest.config.ts template/vitest.config.ts

      - name: Check playwright config matches testing module
        run: diff modules/testing/playwright.config.ts template/playwright.config.ts

      - name: Check CI workflow matches ci module
        run: diff modules/ci/.github/workflows/ci.yml template/.github/workflows/ci.yml

      - name: Check accessibility workflow matches ci module
        run: diff modules/ci/.github/workflows/accessibility.yml template/.github/workflows/accessibility.yml

      - name: Check e2e workflow matches ci module
        run: diff modules/ci/.github/workflows/e2e.yml template/.github/workflows/e2e.yml

      - name: Check content-acceptance lib/content-acceptance.ts matches template
        run: diff modules/content-acceptance/lib/content-acceptance.ts template/src/lib/content-acceptance.ts

      - name: Check content-acceptance lib/require-admin.ts matches template
        run: diff modules/content-acceptance/lib/require-admin.ts template/src/lib/require-admin.ts

      - name: Check content-acceptance routes/accept/route.ts matches template
        run: diff modules/content-acceptance/routes/accept/route.ts template/src/app/api/content/accept/route.ts

      - name: Check content-acceptance routes/status/route.ts matches template
        run: diff modules/content-acceptance/routes/status/route.ts template/src/app/api/content/status/route.ts

      - name: Check content-acceptance routes/deploy-gate/route.ts matches template
        run: diff modules/content-acceptance/routes/deploy-gate/route.ts template/src/app/api/deploy/route.ts

      - name: Check content-acceptance scripts/lint-content.mjs matches template
        run: diff modules/content-acceptance/scripts/lint-content.mjs template/scripts/lint-content.mjs

      - name: Check content-acceptance scripts/content-report.mjs matches template
        run: diff modules/content-acceptance/scripts/content-report.mjs template/scripts/content-report.mjs

      - name: Check content-acceptance supabase/migration.sql matches template
        run: diff modules/content-acceptance/supabase/migration.sql template/supabase/migrations/00002_content_acceptance.sql

      - name: Verify template builds
        working-directory: template
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run type-check
          pnpm run lint
          pnpm run build
